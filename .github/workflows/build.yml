name: Helper builds (Windows .exe, macOS .app)

# Builds the end-user "V-Pad Helper" tray app that iOS users install on
# their PC. A Windows .exe cannot be produced from the macOS dev machine —
# PyInstaller emits host-native binaries — so this is the only build path.
#
#   • every push and PR → artifact. This whole repo IS the helper, so there
#     is nothing to path-filter; packaging breaks in ways only a Windows box
#     sees (a hidden import PyInstaller cannot infer, package data that never
#     got collected), so every change is built.
#   • tag `v*` → artifact + a GitHub Release with the .exe attached. That
#     release is the public download the iPhone app and the website link to.
#
# NOTE on the trigger shape: under `push`, `branches`/`tags` are REF filters.
# Give only `tags` and a push to a branch never matches — learned the hard
# way, it produced zero runs. Both filters are listed.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write # needed only by the release step on a tag

jobs:
  build:
    runs-on: windows-latest
    # A packaging build is ~4 minutes. Anything near this ceiling is a hang,
    # not slowness — see the dependency step for the one that bit us.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Satisfy vgamepad's ViGEmBus check (build host only)
        # vgamepad ships NO wheel, so `pip install` always executes its
        # setup.py, and that file ends with:
        #
        #     # Prompt installation of the ViGEmBus driver (blocking call)
        #     if not vigem_installed:
        #         subprocess.call(['msiexec', '/i', pathMsi], shell=True)
        #
        # On a runner that MSI dialog is never answered — the first attempt
        # hung for 20 minutes. `vigem_installed` is decided by ONE thing:
        # whether "nefarius virtual gamepad emulation bus driver" appears in
        # the registry's Uninstall tree. Writing that key satisfies the check
        # so setup.py skips the installer.
        #
        # We are not faking a capability: this host only needs vgamepad's
        # FILES (the Python package plus the ViGEmBus MSI it carries, which
        # the .spec bundles). The driver itself belongs on the end user's
        # machine, installed from the tray menu — installing a kernel driver
        # on a throwaway runner would be slower and flakier for no gain.
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\VPadHelperBuildStub"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DisplayName `
            -Value "Nefarius Virtual Gamepad Emulation Bus Driver"
          Set-ItemProperty -Path $key -Name DisplayVersion -Value "1.17.333.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller (SABİT sürüm, HAZIR bootloader)
        # ⚠️ Bu satır 2026-08-21'de TERSİNE ÇEVRİLDİ. Öncesinde
        # `--no-binary pyinstaller` vardı ve gerekçesi şuydu: "hazır
        # bootloader binlerce zararlıyla bayt bayt ortak, kaynaktan
        # derleyince eşleşme kırılır." O gerekçe YANLIŞ çıktı.
        #
        # ÖLÇÜM (bu makinenin Defender tehdit geçmişi, koruma AÇIK):
        #
        #     15.08  Trojan:Win32/Wacatac.C!ml
        #     20.08  Program:Win32/Wacapew.A!ml
        #     21.08  Trojan:Win32/Sabsik.FL.A!ml
        #
        # Bootloader'ı kaynaktan derlediğimiz hâlde işaretlenmeye devam etti,
        # ve VERDICT AİLESİ HER SEFERİNDE DEĞİŞTİ. Zararlıyla paylaşılan bir
        # bayt deseni olsaydı verdict SABİT kalırdı; üç ayrı ML ailesi
        # "bu dosyayı hiç görmedim, itibarı yok" demektir. Sorun desen
        # değil, İTİBAR.
        #
        # PyInstaller ekibinin kendi metni de bunu söylüyor
        # (.github/ISSUE_TEMPLATE/antivirus.md):
        #   "Bir sürümün daha az yanlış pozitif alması o sürümün doğru bir şey
        #    yaptığını göstermez — sadece FARKLIDIR, farklı checksum'ı vardır
        #    ve baştan ezberlenmesi gerekir."
        # ve yeniden derlemeyi açıkça "iki ucu keskin bıçak" diye niteliyor:
        # seni farklı yapar, ama PyInstaller beyaz listeye alınırsa senin
        # yapın ondan faydalanamaz. Bir maintainer mekanizmayı da veriyor:
        # Defender bootloader'ları EZBERLİYOR ve kullanıcılar yanlış pozitif
        # bildirdikçe beyaz listeye ekliyor.
        #
        # Yani her CI koşusunda yeni bir bootloader üretmek, her sürümün
        # SIFIR itibarla doğması demekti — ölçülen aile savrulması tam olarak
        # bu. Artık HAZIR wheel kullanıyoruz ve sürümü SABİTLİYORUZ ki
        # bootloader baytları sürümler arası AYNI kalsın ve itibar biriksin.
        #
        # Sürüm seçimi: 6.22.x hattı bu commit'te dört günlük (6.22.2 →
        # 2026-08-17) ve "en yeni sürüm işaretlenir" tam olarak o durum.
        # 6.21.0 (2026-06-13) bootloader'ı beyaz listeye girecek kadar eski,
        # hâlâ desteklenecek kadar yeni. İşaretlenme sürerse bir sonraki
        # deneme 6.20.0'dır — ama sürümü SIK DEĞİŞTİRME, her değişiklik
        # itibarı sıfırlar.
        #
        # Sıradaki kaldıraçlar: Microsoft'a yanlış-pozitif bildirimi
        # (microsoft.com/en-us/wdsi/filesubmission — Setup ve çıplak exe AYRI
        # verdict alıyor, ikisi ayrı gönderilmeli) ve kod imzalama.
        run: pip install "pyinstaller==6.21.0"

      - name: Resolve the version
        # vpad_helper.py's __version__ is the single source of truth. On a
        # tag build the tag must agree with it: bumping only the tag used
        # to ship an installer whose Add/Remove Programs entry, filename
        # and version resource all still claimed the previous release.
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path vpad_helper.py -Pattern '^__version__\s*=\s*"([^"]+)"'
          if (-not $m) { throw "no __version__ in vpad_helper.py" }
          $v = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            if ($tag -ne $v) {
              throw "tag ${{ github.ref_name }} does not match __version__ $v — bump vpad_helper.py"
            }
          }
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          "building $v"

      - name: Build one-file exe
        run: pyinstaller --noconfirm vpad-helper.spec

      - name: Build one-dir bundle (payload for the installer)
        # Separate workpath: the two layouts share a spec but not a build
        # tree, and reusing it makes the second run trip over the first
        # run's TOCs.
        env:
          VPAD_ONEDIR: "1"
        run: pyinstaller --noconfirm --distpath dist-onedir --workpath build-onedir vpad-helper.spec

      - name: Sign the executables
        # Before packaging, not after: the installer carries these files,
        # so signing them afterwards would sign nothing that ships. No-op
        # without the certificate secrets — forks and PRs still build.
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./sign-windows.ps1 "dist/V-Pad Helper.exe" "dist-onedir/V-Pad Helper/V-Pad Helper.exe"

      - name: Build the installer
        # Inno Setup 6 is preinstalled on the windows runner images; the
        # path is searched rather than hard-coded because the image has
        # moved it before.
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found on this runner" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }

      - name: Sign the installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./sign-windows.ps1 "dist-installer/V-Pad-Helper-Setup.exe"

      - name: Sanity-check the artifacts
        shell: pwsh
        run: |
          $want = @(
            "dist/V-Pad Helper.exe",
            "dist-installer/V-Pad-Helper-Setup.exe"
          )
          foreach ($f in $want) {
            if (-not (Test-Path $f)) { throw "build produced no $f" }
            $i = Get-Item $f
            "{0,-46} {1,7:N1} MB  v{2}" -f $i.Name, ($i.Length / 1MB), $i.VersionInfo.FileVersion
          }
          # A blank version resource is the failure this guards: the build
          # still succeeds, and the shipped file looks unattributed.
          $exe = Get-Item "dist/V-Pad Helper.exe"
          if (-not $exe.VersionInfo.ProductName) { throw "exe has no version resource" }

      - uses: actions/upload-artifact@v4
        with:
          name: vpad-helper-windows
          path: |
            dist/V-Pad Helper.exe
            dist-installer/V-Pad-Helper-Setup.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Installer first — it is the recommended download. The bare .exe
          # stays published because older releases, the README and the
          # website have linked straight at it, and a 404 is worse than a
          # second option.
          files: |
            dist-installer/V-Pad-Helper-Setup.exe
            dist/V-Pad Helper.exe
          body: |
            **V-Pad Helper for Windows** — the companion app for V-Pad on iPhone.

            1. Download **`V-Pad-Helper-Setup.exe`** and run it.
               It installs for your user only, so it does not ask for administrator
               rights, and it puts an uninstaller in Add/Remove Programs. The app
               itself lives in the system tray.
            2. If the tray offers "Install gamepad driver", accept it once (ViGEmBus —
               this is what lets games see a real Xbox controller). That step *does*
               need administrator rights, because it installs a driver.
            3. On the iPhone: open V-Pad → Connection → tap this computer.

            Keep the phone and the PC on the same Wi-Fi network. Windows will ask
            once whether the app may use the network — allow it on **private**
            networks, otherwise the phone can see the computer but not connect.

            `V-Pad Helper.exe` is the same app without an installer, for anyone who
            prefers a single file to copy around.

  # ── macOS ───────────────────────────────────────────────────────────
  #
  # Why this exists: the Mac build had no CI, and that is exactly how it
  # fell a release behind — the published DMG still runs the pre-pairing
  # daemon, so no 2.x phone can connect to it. The engine's macOS backend
  # (keyboard + mouse via CGEvent; macOS gives third-party code no
  # user-space virtual-HID path) is now part of the same engine as
  # Windows, and this job proves it still packages.
  #
  # It does NOT publish. The public DMG is signed with the project's
  # Developer ID certificate, which stays on the maintainer's Mac —
  # `./make-dmg.sh dist/"V-Pad Helper.app" V-Pad-Helper.dmg` produces the
  # signed disk image there. An unsigned DMG in a release would be worse
  # than none: Gatekeeper would refuse it and the download would look broken.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Sürüm Windows işiyle AYNI sabitte: iki platform tek araç
          # zincirinde kalsın. Gerekçe için oradaki uzun nota bak.
          pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Engine tests
        working-directory: android-vpad-helper
        run: python -m unittest discover -s host

      - name: Build the .app
        run: pyinstaller --noconfirm vpad-helper.spec

      - name: Sanity-check the bundle
        run: |
          test -d "dist/V-Pad Helper.app" || { echo "no .app produced"; exit 1; }
          # The tray app must not have been built as a bare console binary:
          # a Mac user double-clicks a bundle, not an executable file.
          test -f "dist/V-Pad Helper.app/Contents/Info.plist" || {
            echo "bundle has no Info.plist"; exit 1; }
          du -sh "dist/V-Pad Helper.app"

      - uses: actions/upload-artifact@v4
        with:
          name: vpad-helper-macos-unsigned
          path: dist/V-Pad Helper.app
          if-no-files-found: error
